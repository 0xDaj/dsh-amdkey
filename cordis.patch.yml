# dsh bundle patch：把插件本体插入 profile 的层栈，并声明 Radeon 的 provider。
#
# 缺了 insert 段，DSH 只会合并下面的 config，不会加载插件本身 ——
# 那样既没有代理，也没有 AMDkey 标签页。
- insert:
    - id: dsh-amdkey
      name: dsh-amdkey

# provider 指向本地代理，而不是直连 developer.amd.com.cn。
# apiKey 是占位值：真正的 key 由代理在转发时替换成池子里当前可用的那个，
# 这个占位值不会被发到上游。
- id: llm-pi-ai
  config:
    providers:
      radeon-cloud:
        displayName: AMD Radeon Cloud
        apiKeyEnv: RADEON_LOCAL_KEY
        api: openai-completions
        baseURL: http://127.0.0.1:18888/v1
        compat:
          supportsDeveloperRole: false
          supportsReasoningEffort: true
          supportsThinkingTokenBudget: false
          maxTokensField: max_tokens
          thinkingFormat: openai
        models:
          - id: DeepSeek-V4.1-Flash
            name: DeepSeek-V4.1-Flash
            contextWindow: 1048576
            input: [text, image]
            reasoningEfforts:
              off: none
              minimal: minimal
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
          - id: DeepSeek-V4-Flash
            name: DeepSeek-V4-Flash
            contextWindow: 1048576
            input: [text]
            reasoningEfforts:
              off: none
              minimal: minimal
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
          - id: MiMo-V2.6-Flash
            name: MiMo-V2.6-Flash
            contextWindow: 1048576
            input: [text, image]
            reasoningEfforts:
              off: none
              minimal: minimal
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
